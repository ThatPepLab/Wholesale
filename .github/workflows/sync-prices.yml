name: Sync prices from TPLPrice

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-prices.yml"
      - "catalog-data.json"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "access.css"
      - "msrp.css"
      - "tier-pricing.css"
      - "cart.css"
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wholesale-price-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Wholesale
        uses: actions/checkout@v6

      - name: Check out TPLPrice
        uses: actions/checkout@v6
        with:
          repository: ThatPepLab/TPLPrice
          path: _tplprice

      - name: Rebuild public catalog
        run: node sync-catalog.mjs _tplprice/index.html catalog-data.json

      - name: Save changed prices
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- catalog-data.json; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog-data.json
            git commit -m "Sync wholesale prices from TPLPrice"
            # Another repository update may land while this job is running.
            # Rebase once before pushing so a harmless concurrent commit does not fail the sync.
            git pull --rebase origin main
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove private source checkout
        run: rm -rf _tplprice

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait for deployment file
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node --input-type=module <<'JS'
          const url = process.env.GITHUB_API_URL + '/repos/' + process.env.GITHUB_REPOSITORY +
            '/actions/runs/' + process.env.GITHUB_RUN_ID + '/artifacts';
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch(url, {
              headers: {
                Authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                Accept: 'application/vnd.github+json'
              }
            });
            if (!response.ok) throw new Error('Artifact lookup failed: ' + response.status);
            const data = await response.json();
            const files = data.artifacts.filter(file =>
              file.name === process.env.PAGES_ARTIFACT && !file.expired);
            if (files.length === 1) {
              console.log('Deployment file is available.');
              process.exit(0);
            }
            if (files.length > 1) throw new Error('Duplicate deployment files found.');
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Deployment file did not become available within one minute.');
          JS

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
