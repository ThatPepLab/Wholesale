name: Sync Inventory

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-inventory
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current inventory
        run: curl --fail --silent --show-error --location "https://raw.githubusercontent.com/ThatPepLab/InStock/main/inventory.json" --output inventory.json.next
      - name: Publish inventory changes
        run: |
          if [ -f inventory.json ] && cmp -s inventory.json.next inventory.json; then
            rm inventory.json.next
            exit 0
          fi
          mv inventory.json.next inventory.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory.json
          git commit -m "Sync inventory from InStock"
          git push
